name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore Multiverse-Rumble.slnx

      - name: Compilar
        run: dotnet build Multiverse-Rumble.slnx --no-restore --configuration Release

      - name: Correr pruebas
        run: dotnet test Multiverse-Rumble.slnx --no-build --configuration Release --verbosity normal
